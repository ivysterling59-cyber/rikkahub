name: Build Network Diagnostic APK

on:
  push:
    branches:
      - codex/sse-reader-debug
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        run: |
          printf '%s' '${{ secrets.MOD_KEYSTORE_BASE64 }}' | base64 --decode > app/mod-release.jks
          cat > local.properties <<EOF
          storeFile=mod-release.jks
          storePassword=${{ secrets.MOD_KEYSTORE_PASSWORD }}
          keyAlias=rikkahub-mod
          keyPassword=${{ secrets.MOD_KEY_PASSWORD }}
          EOF

      - name: Run network diagnostic tests
        run: |
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest --tests me.rerere.common.http.AiHttpDiagStoreTest --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiHttpDiagnosticsTest --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiHttpClientFactoryTest --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiRequestProfileInterceptorTest --no-configuration-cache
          ./gradlew :ai:testDebugUnitTest --tests me.rerere.ai.util.ManualSseParserTest --no-configuration-cache

      - name: Build signed universal release APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-universal-release.apk RikkaHub-network-debug5.apk

      - name: Verify release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs RikkaHub-network-debug5.apk
          "$AAPT" dump badging RikkaHub-network-debug5.apk | grep "package: name='com.ivysterling59cyber.rikkahub'"
          "$AAPT" dump badging RikkaHub-network-debug5.apk | grep "versionName='2.4.10-network-debug5'"
          sha256sum RikkaHub-network-debug5.apk > RikkaHub-network-debug5.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-network-debug5
          path: |
            RikkaHub-network-debug5.apk
            RikkaHub-network-debug5.apk.sha256
          if-no-files-found: error

      - name: Publish network experiment prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="network-debug-v2.4.10-5"
          NOTES=$(cat <<'EOF'
          更新内容:

          - 新增 OkHttp EventSource 与普通 OkHttp Call + 手工 SSE Reader 的 A/B 切换。
          - 手工 Reader 独立解析 event/data/id/retry、多行 data 与 [DONE]，不使用 okhttp-sse 内部解析器。
          - 新增 headers、首字节、首 SSE 事件、最后数据及距最后数据时间诊断。
          - 新增最近 20 次失败时长、平均/中位数/最小/最大与 30–33/33–36/36–40/40+ 秒分桶。
          - 保留既有网络模式、请求 Profile、取消栈、非流式诊断、超时和重试语义，不升级依赖。

          Updates:

          - Added an A/B switch between OkHttp EventSource and an ordinary OkHttp Call with a manual SSE reader.
          - The manual reader independently parses event/data/id/retry, multiline data, and [DONE] without okhttp-sse internals.
          - Added header, first-byte, first-event, last-data, and time-since-last-data timing diagnostics.
          - Added a focused latest-20 failure duration view with 30–33/33–36/36–40/40+ second buckets.
          - Preserved network modes, request profiles, cancellation stacks, non-streaming diagnostics, timeouts, retries, and dependency versions.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RikkaHub-network-debug5.apk RikkaHub-network-debug5.apk.sha256 --clobber
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              RikkaHub-network-debug5.apk \
              RikkaHub-network-debug5.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "$NOTES" \
              --prerelease
          fi
