name: Build Network Diagnostic APK

on:
  push:
    branches:
      - codex/network-debug
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        run: |
          printf '%s' '${{ secrets.MOD_KEYSTORE_BASE64 }}' | base64 --decode > app/mod-release.jks
          cat > local.properties <<EOF
          storeFile=mod-release.jks
          storePassword=${{ secrets.MOD_KEYSTORE_PASSWORD }}
          keyAlias=rikkahub-mod
          keyPassword=${{ secrets.MOD_KEY_PASSWORD }}
          EOF

      - name: Run network diagnostic tests
        run: |
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest --tests me.rerere.common.http.AiHttpDiagStoreTest --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiHttpDiagnosticsTest --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiHttpClientFactoryTest --no-configuration-cache

      - name: Build signed universal release APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-universal-release.apk RikkaHub-network-debug3.apk

      - name: Verify release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs RikkaHub-network-debug3.apk
          "$AAPT" dump badging RikkaHub-network-debug3.apk | grep "package: name='com.ivysterling59cyber.rikkahub'"
          "$AAPT" dump badging RikkaHub-network-debug3.apk | grep "versionName='2.4.10-network-debug3'"
          sha256sum RikkaHub-network-debug3.apk > RikkaHub-network-debug3.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-network-debug3
          path: |
            RikkaHub-network-debug3.apk
            RikkaHub-network-debug3.apk.sha256
          if-no-files-found: error

      - name: Publish network experiment prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="2.4.10-network-debug3"
          NOTES=$(cat <<'EOF'
          更新内容:

          - 新增默认、仅 HTTP/1.1、新连接三种 AI 网络实验模式。
          - OpenAI、OpenAI Compatible、DeepSeek、Claude、Gemini 均已接入。
          - 新连接模式为每次 AI 请求创建独立客户端和 ConnectionPool。
          - 日志新增实际协议、模式、客户端、连接池及连接复用信息。
          - 新增当前模式显示和“复制当前网络实验信息”；未修改超时、重试和请求生命周期。

          Updates:

          - Added Default, HTTP/1.1-only, and Fresh Connection AI experiment modes.
          - Applied all modes to OpenAI, compatible APIs, DeepSeek, Claude, and Gemini.
          - Fresh Connection mode creates an independent client and connection pool per AI request.
          - Added runtime protocol, mode, client, pool, and connection-reuse diagnostics.
          - Added current-mode display and experiment-summary copying without timeout, retry, or lifecycle changes.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RikkaHub-network-debug3.apk RikkaHub-network-debug3.apk.sha256 --clobber
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              RikkaHub-network-debug3.apk \
              RikkaHub-network-debug3.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "$NOTES" \
              --prerelease
          fi
