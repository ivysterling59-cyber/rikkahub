name: Build Network Diagnostic APK

on:
  push:
    branches:
      - codex/network-debug
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        run: |
          printf '%s' '${{ secrets.MOD_KEYSTORE_BASE64 }}' | base64 --decode > app/mod-release.jks
          cat > local.properties <<EOF
          storeFile=mod-release.jks
          storePassword=${{ secrets.MOD_KEYSTORE_PASSWORD }}
          keyAlias=rikkahub-mod
          keyPassword=${{ secrets.MOD_KEY_PASSWORD }}
          EOF

      - name: Run network diagnostic tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiHttpDiagnosticsTest --no-configuration-cache

      - name: Build signed universal release APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-universal-release.apk RikkaHub-network-debug.apk

      - name: Verify release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs RikkaHub-network-debug.apk
          "$AAPT" dump badging RikkaHub-network-debug.apk | grep "package: name='com.ivysterling59cyber.rikkahub'"
          "$AAPT" dump badging RikkaHub-network-debug.apk | grep "versionName='2.4.10-network-debug'"
          sha256sum RikkaHub-network-debug.apk > RikkaHub-network-debug.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-network-debug
          path: |
            RikkaHub-network-debug.apk
            RikkaHub-network-debug.apk.sha256
          if-no-files-found: error

      - name: Publish network diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="network-debug-v2.4.10-1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RikkaHub-network-debug.apk RikkaHub-network-debug.apk.sha256 --clobber
          else
            gh release create "$TAG" \
              RikkaHub-network-debug.apk \
              RikkaHub-network-debug.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "RikkaHub 2.4.10 Network Diagnostic Test" \
              --notes "Diagnostic prerelease for identifying coroutine cancellation, local OkHttp Call.cancel(), response-body EOF, timeout, and remote connection failures. Does not force HTTP/1.1 and does not log API keys, prompts, or response content." \
              --prerelease
          fi
