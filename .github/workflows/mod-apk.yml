name: Build Network Diagnostic APK

on:
  push:
    branches:
      - codex/network-debug
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        run: |
          printf '%s' '${{ secrets.MOD_KEYSTORE_BASE64 }}' | base64 --decode > app/mod-release.jks
          cat > local.properties <<EOF
          storeFile=mod-release.jks
          storePassword=${{ secrets.MOD_KEYSTORE_PASSWORD }}
          keyAlias=rikkahub-mod
          keyPassword=${{ secrets.MOD_KEY_PASSWORD }}
          EOF

      - name: Run network diagnostic tests
        run: |
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest --tests me.rerere.common.http.AiHttpDiagStoreTest --no-configuration-cache
          ./gradlew :app:testDebugUnitTest --tests me.rerere.rikkahub.data.ai.AiHttpDiagnosticsTest --no-configuration-cache

      - name: Build signed universal release APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-universal-release.apk RikkaHub-network-debug2.apk

      - name: Verify release APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs RikkaHub-network-debug2.apk
          "$AAPT" dump badging RikkaHub-network-debug2.apk | grep "package: name='com.ivysterling59cyber.rikkahub'"
          "$AAPT" dump badging RikkaHub-network-debug2.apk | grep "versionName='2.4.10-network-debug2'"
          sha256sum RikkaHub-network-debug2.apk > RikkaHub-network-debug2.apk.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RikkaHub-network-debug2
          path: |
            RikkaHub-network-debug2.apk
            RikkaHub-network-debug2.apk.sha256
          if-no-files-found: error

      - name: Publish network diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="network-debug-v2.4.10-2"
          NOTES=$(cat <<'EOF'
          更新内容:
          - 新增应用内 AiHttpDiag 网络诊断日志页面。
          - 支持事件、Provider 和 requestId 筛选。
          - 支持复制最近失败请求、导出 TXT 和清空日志。
          - 使用 1500 条线程安全内存缓冲，并脱敏 URL 查询、API Key 和异常堆栈。

          Updates:
          - Added an in-app AiHttpDiag network diagnostics page.
          - Added event, provider, and requestId filters.
          - Added copy-latest-failure, TXT export, and clear-log actions.
          - Added a thread-safe 1,500-entry memory buffer with URL, credential, and stack-trace redaction.
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" RikkaHub-network-debug2.apk RikkaHub-network-debug2.apk.sha256 --clobber
            gh release edit "$TAG" --title "RikkaHub 2.4.10 Network Debug 2" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              RikkaHub-network-debug2.apk \
              RikkaHub-network-debug2.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "RikkaHub 2.4.10 Network Debug 2" \
              --notes "$NOTES" \
              --prerelease
          fi
